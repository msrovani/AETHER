[package]
name = "aether_engine"
version = "0.0.175"
edition = "2021"
rust-version = "1.78"
description = "AETHER ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Â¦Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â motor de computacao pos-token baseado em fisica continua (Ising continuo, interferencia espectral, Kuramoto UDP)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "aether_engine"
path = "src/lib.rs"

[[bin]]
name = "aether-organism"
path = "src/bin/organism.rs"
required-features = ["m4"]

[[bin]]
name = "aether-daemon"
path = "src/bin/aether_daemon.rs"
required-features = ["m8"]

# Borda externa: HTTP/JSON para apps de IA (OpenAI-compat + llama.cpp).
[[bin]]
name = "aether-api"
path = "src/bin/aether_api.rs"
required-features = ["api"]

[[bin]]
name = "aether-dashboard"
path = "src/bin/aether_dashboard.rs"
required-features = ["dashboard"]

# CLI do encaixe neural-sgdb (T2): doctor/put/recall/sync/export/import.
[[bin]]
name = "aether-sgdb"
path = "src/bin/aether_sgdb.rs"
required-features = ["sgdb"]

# Organismo agÃƒÂªntico: inferÃƒÂªncia + MoE + coerÃƒÂªncia + autoaprendizado.
[[bin]]
name = "aether-agent"
path = "src/bin/aether_agent.rs"
required-features = ["agent"]

# Fase 6: governador de hardware real (telemetria viva + frame binario 32 B).
[[bin]]
name = "aether-governor"
path = "src/bin/aether_governor.rs"
required-features = ["m1", "m2", "m3", "m5"]

# Features de modulo: permitem build isolado de cada pilar (paralelismo de agentes
# sem colisao de codigo) e compilacao enxuta quando so um pilar e necessario.
[features]
default = ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "sgdb", "agent"]
m1 = []
m2 = []
m3 = []
m4 = ["m1", "m2", "m3", "dep:ratatui", "dep:crossterm"]
tui = ["m4"]
m5 = []
m6 = ["m1"]
m7 = ["m1"]
m8 = ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "sgdb"]
# Borda externa HTTP/JSON (T2) para apps de IA Ã¢â‚¬â€ OpenAI-compat e llama.cpp.
# Sem dependÃƒÂªncia nova: HTTP/1.1 mÃƒÂ­nimo sobre std::net.
# Inclui o sink durÃƒÂ¡vel do neural-sgdb e o agente (rota /v1/aether/agent).
api = ["m1", "sgdb", "agent"]
# Dashboard Windows de metricas (egui). Opt-in; nao entra no default.
dashboard = ["dep:eframe", "dep:egui", "dep:serde", "dep:serde_json", "m4"]
# FASE 5 (hardware extremus): JIT Cranelift para termos SINDy ativos e pinning
# de threads por nucleo. Ambos opcionais; sem eles o crate cai em fallbacks
# interpretados / no-op (ver src/core/sindy_jit.rs e aether_governor.rs).
jit = [
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
]
affinity = ["dep:core_affinity", "dep:num_cpus"]
# Fase 1 (OPENCODE): fonte de entropia de hardware opt-in.
hw-entropy = []
# GPU opt-in (docs/GPU_PLAN.md): GEMM do transplante. Sem a feature o crate e
# CPU-only completo; com ela, fallback CPU se nao houver adapter.
gpu = ["dep:wgpu", "dep:bytemuck"]
# T2: encaixe operacional do neural-sgdb (MCP sobre stdio/HTTP + outbox).
# Sem dependencia nova: JSON-RPC/HTTP/1.1 e JSON minimo vivem no crate.
sgdb = ["m1"]
# Agente: especialistas (FHRR, fase, lÃƒÂ³gica, solver, SGDB) + MoE + coerÃƒÂªncia.
agent = ["m1", "m5", "sgdb"]

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
rustfft = "6.2"
realfft = "3.3"
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
socket2 = "0.5"
mio = { version = "1", features = ["net", "os-poll"] }
crossbeam-channel = "0.5"
thiserror = "2"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
cranelift-jit = { version = "0.113.1", optional = true }
cranelift-module = { version = "0.113.1", optional = true }
cranelift-codegen = { version = "0.113.1", optional = true }
cranelift-frontend = { version = "0.113.1", optional = true }
cranelift-native = { version = "0.113.1", optional = true }
core_affinity = { version = "0.8.3", optional = true }
num_cpus = { version = "1.17", optional = true }
eframe = { version = "0.29", optional = true, default-features = true }
egui = { version = "0.29", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# GPU (opcional, fora do default). Versao fixada na cache local do registro.
wgpu = { version = "22", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "solver"
harness = false
required-features = ["m1"]

[[bench]]
name = "wave"
harness = false
required-features = ["m2"]

[[bench]]
name = "kuramoto_latency"
harness = false
required-features = ["m3"]

[[example]]
name = "field_probe"
path = "examples/field_probe.rs"
required-features = ["m2"]

[[example]]
name = "transducer_probe"
required-features = ["m8"]

[[example]]
name = "bam_probe"
path = "examples/bam_probe.rs"
required-features = ["m4", "m5", "affinity"]

[[example]]
name = "cram_logos_probe"
path = "examples/cram_logos_probe.rs"
required-features = ["m1"]

[[example]]
name = "sgdb_roundtrip"
path = "examples/sgdb_roundtrip.rs"
required-features = ["sgdb"]

[[example]]
name = "transplant_hv_probe"
path = "examples/transplant_hv_probe.rs"
required-features = ["m1"]

[[bench]]
name = "organism"
harness = false
required-features = ["m4"]

[[bench]]
name = "throughput_tps"
harness = false
required-features = ["m4"]

[[bench]]
name = "phase_recall"
harness = false
required-features = ["m5"]

[[bench]]
name = "bam_probe"
harness = false

[[bench]]
name = "t12_probe"
harness = false
required-features = ["m5"]

[[bench]]
name = "bam_phase_review"
harness = false
required-features = ["m1"]

[[bench]]
name = "poly_vs_lut"
harness = false
required-features = ["m1"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = 1

[profile.bench]
inherits = "release"
debug = 1

[[bench]]
name = "hardware_extremus"
harness = false
required-features = ["m1", "m5"]


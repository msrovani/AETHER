[package]
name = "aether_decision"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "DecisionPort: AND gate vega-U (0.8B + gemma-prose) via FFI PyO3 — plano F2->F3"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "aether_decision"
path = "src/lib.rs"

[features]
default = []
# Ativa o binding PyO3 (embed do interpreter). O build default NAO precisa de Python.
pyo3 = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.30", optional = true, features = ["auto-initialize"] }

# O smoke do F1 usa o binding PyO3 (interpreter + engine reais). Sem a feature
# `pyo3` o exemplo nem compila — o gate é o proprio manifesto, nao um if no
# codigo: build default nao precisa de Python.
[[example]]
name = "f1_smoke"
required-features = ["pyo3"]

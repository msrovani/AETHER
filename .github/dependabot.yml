# R8 (auditoria 2026-11-27): dependências atualizadas automaticamente.
# Sem isto, o lock apodrece silenciosamente (wgpu 22 vs série atual 30 etc.).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
